name: Build APK

# Tự động chạy mỗi khi có người push code lên nhánh main,
# hoặc bấm "Run workflow" thủ công trong tab Actions.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code từ repo
        uses: actions/checkout@v4

      - name: Tự giải nén file .zip trong repo (nếu người dùng upload thẳng .zip)
        # MỚI - dành cho việc upload TỪ ĐIỆN THOẠI: giao diện chọn file trên
        # trình duyệt/app điện thoại KHÔNG hỗ trợ chọn "cả 1 thư mục" đáng tin
        # cậy (dễ bỏ sót file/thư mục con, đặc biệt thư mục ẩn như .github) -
        # cách THỰC TẾ nhất trên điện thoại là upload THẲNG 1 file .zip duy
        # nhất (kéo thả 1 file, không phải nhiều file/thư mục lồng nhau).
        # Bước này tự tìm file .zip BẤT KỲ ở gốc repo và TỰ GIẢI NÉN ngay
        # trên máy chủ GitHub Actions (môi trường Linux đầy đủ dòng lệnh,
        # không bị giới hạn như file picker điện thoại) - người dùng KHÔNG
        # cần tự giải nén/chọn từng file/thư mục con trên điện thoại nữa.
        # An toàn khi chạy nhiều lần / khi repo ĐÃ có sẵn code giải nén tay
        # (không có file .zip nào) - tự bỏ qua, không báo lỗi.
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Tìm thấy file zip: $ZIP_FILE - đang giải nén..."
            unzip -o -q "$ZIP_FILE" -d .
            echo "Đã giải nén xong. Nội dung thư mục gốc sau khi giải nén:"
            ls -la
          else
            echo "Không tìm thấy file .zip nào ở gốc repo - bỏ qua bước này (có thể code đã ở dạng thư mục sẵn)."
          fi

      - name: Kiểm tra repo có ĐÚNG source code thật (không phải thiếu file)
        # Chặn NGAY nếu lib/main.dart THẬT của app này không có trong repo
        # (kể cả sau khi đã thử tự giải nén .zip ở bước trên) - thay vì để
        # build "thành công" âm thầm ra app SAI (bước `flutter create` bên
        # dưới sẽ tự điền 1 main.dart MẶC ĐỊNH - app đếm số demo của Flutter -
        # nếu thấy lib/main.dart bị THIẾU, và build vẫn chạy trót lọt, ra APK
        # trông "build xong" nhưng hoàn toàn không phải app AI MV Generator -
        # đây CHÍNH XÁC là lỗi thật đã xảy ra 1 lần).
        # Dùng đúng 1 dòng import ĐẶC TRƯNG chỉ có trong main.dart THẬT của
        # app này (không có trong main.dart mặc định của flutter create) làm
        # dấu hiệu nhận biết.
        run: |
          if [ ! -f lib/main.dart ]; then
            echo "::error::lib/main.dart KHÔNG TỒN TẠI trong repo sau khi giải nén."
            echo "::error::Kiểm tra lại: bạn đã upload đúng file .zip chưa bị hỏng/thiếu chưa?"
            exit 1
          fi
          if ! grep -q "screens/home_screen.dart" lib/main.dart; then
            echo "::error::lib/main.dart KHÔNG PHẢI file main.dart thật của app AI MV Generator"
            echo "::error::(thiếu dòng import 'screens/home_screen.dart') - file .zip có thể bị hỏng/sai."
            exit 1
          fi
          echo "OK - lib/main.dart đúng là file thật của app."

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # KHÔNG ghim flutter-version cố định nữa (từng ghim '3.24.0' - phát
          # hành giữa 2024, đã CŨ ~2 năm so với thời điểm build thật). Đây
          # CHÍNH LÀ nguyên nhân gốc của cả 1 CHUỖI lỗi tưởng như không liên
          # quan (disk_space_plus/gal/http-flutter_svg version-solving-failed,
          # rồi tới lỗi Gradle "Could not get unknown property 'flutter'" của
          # gal 2.3.3) - package trên pub.dev cập nhật liên tục theo Flutter/
          # AGP hiện hành, ghim SDK build quá cũ trong khi dependencies luôn
          # là bản MỚI NHẤT tại thời điểm build → lệch pha ngày càng xa theo
          # thời gian, càng để lâu càng nhiều lỗi kiểu này. Dùng đúng bản
          # 'stable' hiện hành mỗi lần build loại bỏ tận gốc cả nhóm lỗi này,
          # không phải vá từng package một mãi mãi.

      - name: Tạo khung Android (nếu repo chưa có sẵn thư mục android/)
        # QUAN TRỌNG: PHẢI chỉ định --project-name tường minh - nếu không,
        # `flutter create .` tự suy tên gói Dart từ TÊN THƯ MỤC hiện tại
        # (trên GitHub Actions = TÊN REPO, vd "MVMUSIC-APK") - tên repo GitHub
        # KHÔNG bắt buộc theo quy tắc đặt tên gói Dart (chữ thường, gạch dưới,
        # không ký tự hoa/gạch ngang) nên rất dễ lỗi "is not a valid Dart
        # package name" nếu repo đặt tên khác quy tắc này (vd viết hoa, có
        # dấu gạch ngang). Ép đúng tên khớp với `name:` trong pubspec.yaml để
        # KHÔNG phụ thuộc vào tên repo người dùng đặt là gì.
        run: flutter create --platforms=android --project-name ai_mv_generator .

      - name: Đổi tên hiển thị app thành "MVMUSIC"
        # MỚI - `flutter create` mặc định đặt android:label trùng tên gói Dart
        # ("ai_mv_generator") - đổi thành tên hiển thị mong muốn trên máy
        # người dùng (tên gói Dart và tên HIỂN THỊ trên màn hình máy là 2 thứ
        # khác nhau, đổi cái này không ảnh hưởng cái kia). sed thay THẲNG giá
        # trị android:label trong thẻ <application>, không phụ thuộc giá trị
        # gốc là gì (khớp theo pattern `android:label="..."` bất kỳ).
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="MVMUSIC"/' "$MANIFEST"
          grep "android:label" "$MANIFEST"

      - name: Đảm bảo có quyền INTERNET + lưu trữ media (cho package gal) trong AndroidManifest.xml
        # KHÔNG phụ thuộc việc `flutter create` có tự thêm các quyền này hay
        # không (chưa kiểm chứng chắc chắn giữa các phiên bản Flutter) -
        # tự kiểm tra và chèn nếu thiếu. Idempotent - chạy lại nhiều lần vẫn an toàn.
        # READ_MEDIA_VIDEO: Android 13+ (API 33+) - quyền đọc thư viện video mới.
        # WRITE_EXTERNAL_STORAGE maxSdkVersion=32: chỉ áp dụng Android 12 trở xuống,
        # từ Android 13 quyền này bị bỏ qua nên không ảnh hưởng thiết bị mới.
        # FOREGROUND_SERVICE* : cho package flutter_background_service - giữ
        # tiến trình % cập nhật qua thông báo dù màn hình khoá / chuyển app khác.
        # LƯU Ý: KHÔNG tự khai báo <service> ở đây - package
        # flutter_background_service_android đã có SẴN AndroidManifest.xml
        # riêng khai báo đúng <service> đó rồi (được Gradle tự MERGE vào app
        # lúc build) - khai báo tay thêm 1 lần nữa ở đây từng gây lỗi
        # "Manifest merger failed" (giá trị android:exported="false" của mình
        # đụng độ với "true" plugin tự khai) - chỉ cần xin đủ quyền permission
        # là đủ, không cần đụng vào thẻ <service>.
        # POST_NOTIFICATIONS: Android 13+ cần quyền này để HIỆN được thông báo đó
        # (app chưa xin quyền lúc chạy - có thể cần bấm cho phép thủ công trong
        # Cài đặt > Ứng dụng > MVMUSIC > Thông báo trên máy Android 13+ nếu không
        # tự hiện popup xin quyền).
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.READ_MEDIA_VIDEO" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.FOREGROUND_SERVICE\"" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.FOREGROUND_SERVICE_DATA_SYNC" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"
          fi
          echo "--- AndroidManifest.xml sau khi kiểm tra ---"
          cat "$MANIFEST"

      - name: Cho phép kết nối http:// KHÔNG mã hoá - CHỈ trong bản debug
        # Workflow này chỉ build bản RELEASE (bước dưới) nên file debug-only
        # này KHÔNG ảnh hưởng gì tới APK thực tế phân phối cho người dùng -
        # release luôn giữ nguyên yêu cầu https/wss mặc định của Android, an
        # toàn như cũ. File này chỉ có tác dụng nếu SAU NÀY có ai (dev, không
        # phải người dùng cuối) chạy `flutter run` ở máy riêng để debug/test
        # bằng địa chỉ http:// cục bộ (LAN) thay vì qua Cloudflare Tunnel.
        run: |
          mkdir -p android/app/src/debug
          cat > android/app/src/debug/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:usesCleartextTraffic="true" />
          </manifest>
          MANIFEST_EOF

      - name: Cài dependencies
        run: flutter pub get

      - name: Sinh icon launcher từ assets/icon/
        # MỚI - chạy `flutter_launcher_icons` (đã khai báo cấu hình trong
        # pubspec.yaml) để tự sinh icon cho MỌI độ phân giải Android từ 2 ảnh
        # gốc, GHI ĐÈ icon mặc định flutter tạo ra ở bước `flutter create`.
        run: dart run flutter_launcher_icons

      - name: Build file APK
        run: flutter build apk --release

      - name: Tải APK lên (xem ở tab Actions -> lần chạy này -> mục Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
